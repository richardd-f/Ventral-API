services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ventral-api
    restart: always
    env_file:
      - .env
    expose:
      - "3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - npm_default
    command: sh -c "pnpm prisma migrate deploy && pnpm run start"

networks:
  npm_default:
    external: true
